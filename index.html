<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title><!--profile-name--> – Portfolio</title>
    <meta name="description" content="%DESCRIPTION%">
    <meta name="theme-color" content="#050505">
    <meta property="og:type" content="website">
    <meta property="og:url" content="%SITE_URL%/">
    <meta property="og:title" content="<!--profile-name--> – Portfolio">
    <meta property="og:description" content="%DESCRIPTION%">
    <meta property="og:image" content="%SITE_URL%/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The career tree of <!--profile-name-->, with the path to the current role highlighted">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="%SITE_URL%/">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23d66853'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="heading">
        <h1><!--profile-name--></h1>
        <p class="tagline"><!--profile-tagline--></p>
        <p class="subtitle"><!--profile-role--></p>
        <nav class="links"><!--profile-links--></nav>

        <div class="controls">
            <button type="button" id="controls_scroll_up" aria-label="Travel up the tree">↑</button>
            <button type="button" id="controls_scroll_down" aria-label="Travel down the tree">↓</button>
            <button type="button" id="controls_list" aria-expanded="false" aria-controls="milestones">All milestones</button>
        </div>
    </header>

    <main id="render" aria-label="Interactive career tree">
        <div id="hint" role="tooltip" aria-hidden="true">
            <span class="hint-title"></span>
            <span class="hint-meta"></span>
        </div>
        <div id="depth" aria-hidden="true"><span></span></div>
        <p id="help" aria-hidden="true">Drag to rotate · scroll to travel · click a node</p>
    </main>

    <aside id="overlay" role="dialog" aria-labelledby="title" tabindex="-1" hidden>
        <button type="button" class="close" aria-label="Close">×</button>
        <p id="timestamp"></p>
        <h2 id="title"></h2>
        <p id="subtitle" class="subtitle"></p>
        <div id="description"></div>
        <ul id="skills" class="chips"></ul>
        <div id="relations"></div>
        <nav class="stepper">
            <button type="button" id="prev">← Earlier</button>
            <button type="button" id="next">Later →</button>
        </nav>
    </aside>

    <section id="milestones" aria-label="All milestones">
        <h2>Milestones</h2>
        <ol><!--milestones--></ol>
    </section>

    <script src="js/main.js" type="module"></script>
</body>
</html>
